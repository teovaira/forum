<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forum – Log In</title>

    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-page">

{{template "simple-header" .}}

<main class="container auth-page__main">

    <section class="auth-panel" aria-labelledby="login-title">

        <div class="auth-panel__header">

            <h1
                id="login-title"
                class="auth-panel__title"
            >
                Log In
            </h1>

            <p class="auth-panel__subtitle">
                Enter the forum and continue the discussion.
            </p>

        </div>

        {{if .ErrorMessage}}
            <p
                class="auth-form__error"
                role="alert"
            >
                {{.ErrorMessage}}
            </p>
        {{end}}

        <form
            method="post"
            action="/login"
            class="auth-form"
        >

            <label class="auth-form__field">

                <span>Email</span>

                <input
                    type="email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </label>

            <label class="auth-form__field">

                <span>Password</span>

                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </label>

            <button type="submit">
                Log In
            </button>

        </form>

        <p class="auth-panel__switch">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>

    </section>

</main>

{{template "footer" .}}

</body>
</html>
