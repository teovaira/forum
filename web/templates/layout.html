{{define "header"}}
<header class="site-header">
    <a href="/" class="site-header__logo">Forum</a>
    <nav class="site-header__nav">
        <a href="/">Home</a>
        {{if .CurrentUser}}
            <a href="/posts/new">New Post</a>
            <a href="/?filter=mine">My Posts</a>
            <a href="/?filter=liked">Liked Posts</a>
            <span class="site-header__user">{{.CurrentUser.Username}}</span>
            <form method="post" action="/logout">
                <button type="submit" class="site-header__logout">Log Out</button>
            </form>
        {{else}}
            <a href="/login">Log In</a>
            <a href="/register">Register</a>
        {{end}}
    </nav>
</header>
{{end}}

{{define "simple-header"}}
<header class="site-header">
    <a href="/" class="site-header__logo">Forum</a>
</header>
{{end}}

{{define "footer"}}
<footer class="site-footer">
    <p>Forum</p>
</footer>
{{end}}
