{{define "header"}}
<header class="site-header">
    <a href="/" class="site-header__logo">
        Anime Forum
    </a>

    <nav class="site-header__nav" aria-label="Main navigation">
        <a href="/">Home</a>

        {{if .CurrentUser}}
            <a href="/posts/new">New Post</a>
            <a href="/?filter=mine">My Posts</a>
            <a href="/?filter=liked">Liked Posts</a>

            <span class="site-header__user">
                {{.CurrentUser.Username}}
            </span>

            <form
                method="post"
                action="/logout"
                class="logout-form"
            >
                <button
                    type="submit"
                    class="site-header__logout"
                >
                    Log Out
                </button>
            </form>

            <div
                id="logout-modal"
                class="modal"
                hidden
            >
                <div
                    class="modal__backdrop"
                    data-modal-close
                ></div>

                <div
                    class="modal__dialog"
                    role="alertdialog"
                    aria-modal="true"
                    aria-labelledby="logout-modal-title"
                >
                    <p
                        id="logout-modal-title"
                        class="modal__title"
                    >
                        Log out of your account?
                    </p>

                    <div class="modal__actions">
                        <button
                            type="button"
                            class="modal__button modal__button--cancel"
                            data-modal-close
                        >
                            Cancel
                        </button>

                        <button
                            type="button"
                            class="modal__button modal__button--confirm"
                            id="logout-modal-confirm"
                        >
                            Log Out
                        </button>
                    </div>
                </div>
            </div>

        {{else}}

            <a href="/login">Log In</a>
            <a href="/register">Register</a>

        {{end}}
    </nav>
</header>
{{end}}


{{define "simple-header"}}
<header class="site-header site-header--simple">
    <a href="/" class="site-header__logo">
        Anime Forum
    </a>
</header>
{{end}}


{{define "footer"}}
<footer class="site-footer">
    <p class="site-footer__text">
        Anime Forum
    </p>
</footer>

<script src="/static/js/main.js" defer></script>
{{end}}
