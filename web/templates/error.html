<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forum – Error {{.StatusCode}}</title>

    <link
        rel="stylesheet"
        href="/static/css/tokens.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    {{template "simple-header" .}}

    <main class="container error-page">

        <section
            class="error-panel"
            aria-labelledby="error-title"
        >

            <div
                class="error-panel__icon"
                aria-hidden="true"
            >
                ✦
            </div>

            <p class="error-panel__label">
                System Error
            </p>

            <h1
                id="error-title"
                class="error-page__code"
            >
                Error {{.StatusCode}}
            </h1>

            <p class="error-page__message">
                {{.Message}}
            </p>

            <a
                href="/"
                class="error-page__link"
            >
                Return Home
            </a>

        </section>

    </main>

    {{template "footer" .}}

</body>
</html>
